server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventorydb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  sql:
    init:
      mode: always


